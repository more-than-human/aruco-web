<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=1" />
    <title>Demo</title>
  </head>

  <body>
    <div id="app">
      <video loop autoplay muted playsinline id="video"></video>
      <canvas id="paper-canvas"></canvas>
      <canvas id="camera-canvas"></canvas>
      <canvas id="screen-canvas"></canvas>
      <div id="camera-controls">
        <label for="camera-select">Camera:</label>
        <select id="camera-select"></select>
        <span id="frame-counter"></span>
        <button id="print-btn" type="button">Print</button>
        <button id="help-btn" type="button">Help</button>
      </div>
    </div>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
